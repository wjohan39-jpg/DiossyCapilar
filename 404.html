<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#2c0f1e">
  <title>Página no encontrada — Diossy Capilar</title>
  <link rel="stylesheet" href="/css/diossy.css">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@400;500&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"></noscript>
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--color-verde-oscuro, #2c0f1e);
      color: var(--color-blanco, #fffaf8);
      text-align: center;
      padding: 2rem;
      font-family: 'DM Sans', sans-serif;
    }
    .err-logo { width: 120px; margin-bottom: 1.5rem; }
    .err-codigo {
      font-size: clamp(5rem, 15vw, 9rem);
      font-family: 'Playfair Display', serif;
      color: #c9a84c;
      line-height: 1;
      margin: 0;
    }
    .err-titulo {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.4rem, 4vw, 2rem);
      margin: 0.5rem 0 1rem;
    }
    .err-desc {
      max-width: 420px;
      opacity: 0.8;
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    .err-acciones { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }
  </style>
</head>
<body>
  <picture>
    <source srcset="/multimedia/logo-removebg-preview.webp" type="image/webp">
    <img src="/multimedia/logo-removebg-preview.png" alt="Logo Diossy Capilar" class="err-logo">
  </picture>
  <p class="err-codigo">404</p>
  <h1 class="err-titulo">Esta página no existe</h1>
  <p class="err-desc">Parece que la página que buscas no está disponible. Puede que haya sido movida o que la URL esté incorrecta.</p>
  <div class="err-acciones">
    <a href="/" class="btn-verde">Volver al inicio</a>
    <a href="/#contacto" class="btn-blanco">Contáctanos</a>
  </div>
</body>
</html>
